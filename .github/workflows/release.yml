name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build Release
        run: dotnet build build/Stride.sln -c Release -p:StrideNativeWindowsArm64Enabled=false

      - name: Test
        run: dotnet test build/Stride.Tests.Simple.slnf -c Release -p:StrideNativeWindowsArm64Enabled=false --no-build

      - name: Test Modding
        run: dotnet test sources/engine/Stride.Engine.Modding.Tests/ -c Release -p:StrideNativeWindowsArm64Enabled=false --no-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
